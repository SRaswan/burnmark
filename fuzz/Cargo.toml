[workspace]

[package]
name = "fuzzburn-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
oracle-tch = ["fuzzburn/oracle-tch"]
oracle-flex = ["fuzzburn/oracle-flex"]
oracle-cpu = ["fuzzburn/oracle-cpu"]
oracle-tch-raw = ["fuzzburn/oracle-tch-raw"]
oracle-candle = ["fuzzburn/oracle-candle"]

[dependencies]
libfuzzer-sys = "0.4"
fuzzburn = { path = ".." }

# Two fuzz targets:
#   cargo fuzz run fuzz_tensor_ops  – multi-op TensorProgram, NdArray backend
#   cargo fuzz run fuzz_autograd    – autograd / backward-pass fuzzing

[[bin]]
name = "fuzz_tensor_ops"
path = "fuzz_tensor_ops.rs"
test = false
doc = false

[[bin]]
name = "fuzz_autograd"
path = "fuzz_autograd.rs"
test = false
doc = false

# Fuzz against burn `main`, not the published `0.22.0-pre.4` the root crate
# pins.  All five bugs this fuzzer has found are fixed upstream, but the
# `repeat_dim` backward fix (#5837) landed after pre.4 was cut — pointing at a
# release would mean every `Repeat` program re-finding a known bug instead of a
# new one.  The root `Cargo.toml` stays on the published version on purpose, so
# `examples/` keeps showing what a user of a release actually sees.
#
# No `[patch]` entries for the three previously-local fixes are needed anymore:
# sign(NaN) (#5665) and powf_scalar(0) (#5692) are both in pre.4, and burn no
# longer routes recip through macerator's `VRecip` at all (#5553), so the
# macerator patch is moot — burn still pins macerator 0.3.4, which the merged
# Newton-Raphson fix (macerator #47, unreleased) cannot semver-patch anyway.
[patch.crates-io]
burn = { git = "https://github.com/tracel-ai/burn", branch = "main" }
burn-ir = { git = "https://github.com/tracel-ai/burn", branch = "main" }
