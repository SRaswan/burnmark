[workspace]
members = ["."]
exclude = ["fuzz", "llm_benchmark"]
resolver = "2"

[package]
name = "fuzzburn"
version = "0.1.0"
edition = "2024"

[features]
default = []
oracle-tch = ["burn/tch", "dep:tch", "dep:torch-sys"]
# burn-flex: the non-deprecated pure-Rust CPU backend replacing burn-ndarray.
# A distinct implementation, not a rename — it disagrees with NdArray in practice.
oracle-flex = ["burn/flex"]
# CubeCL CPU: the same kernel path burn-cuda / rocm / wgpu compile, run on CPU.
# Non-deprecated, and the only backend besides LibTorch measured correct on the
# sign(NaN) case — so it is the reference side once burn-tch goes. Drop-in: no
# GPU prerequisites (no cross-thread panics, trivial device construction), the
# only cost being CubeCL's build time.
oracle-cpu = ["burn/cpu"]
# Raw tch-rs: libtorch called directly, with no burn in the path.  Distinct
# from `oracle-tch`, which is burn's tch *backend* — the two reach the same
# libtorch and differ only by burn's FFI/translation bridge, so running them
# against each other puts that bridge under test on its own (the class the
# original 0.20.1 `swap_dims` bug belonged to).  Enabling both is the useful
# configuration.  It also outlives burn-tch's removal: `tch` is an
# independent project, and what burn is dropping is the bridge, not libtorch.
oracle-tch-raw = ["dep:tch", "dep:torch-sys"]
# candle: a second non-burn target, and the first that is not a libtorch
# wrapper.  `oracle-tch-raw` reaches the same C++ kernels burn's tch backend
# does, so on the forward pass it tests burn's bridge rather than the math;
# candle is an independent Rust implementation with its own kernels *and* its
# own autograd, which makes it the first genuine second opinion this fuzzer has
# had about either.  `candle-nn` is pulled in for exactly one op — sigmoid,
# which candle-core does not define (see the module doc in
# `ir/interpreter/candle.rs`).
oracle-candle = ["dep:candle-core", "dep:candle-nn"]

[dependencies]
burn = { version = "0.22.0-pre.4", features = ["autodiff", "ndarray"] }
arbitrary = { version = "1.3", features = ["derive"] }
tch = { version = "0.22.0", optional = true }
torch-sys = { version = "0.22.0", optional = true }
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
burn-ir = "0.22.0-pre.4"

# These examples compare NdArray against LibTorch directly, so they need the
# `tch` backend compiled in — gate them the same way the fuzz targets'
# LibTorch oracle path is gated.
[[example]]
name = "simple_autograd"
required-features = ["oracle-tch"]

[[example]]
name = "transpose_bug"
required-features = ["oracle-tch"]

[[example]]
name = "simd_recip_precision_bug"
required-features = ["oracle-tch"]

[[example]]
name = "powi_scalar_zero_grad_bug"
required-features = ["oracle-tch"]

# Deliberately NOT patched here (unlike fuzz/Cargo.toml, which tracks burn
# `main`): this crate pins the latest *published* release, so every repro in
# `examples/` shows what someone on a release actually sees. All five bugs found
# so far are fixed as of 0.22.0-pre.4 — except `repeat_dim` (burn #5837), which
# is merged on `main` but landed after pre.4 was cut — so the bug-repro examples
# now read as regression checks. Each one names the version to pin to see its
# original behaviour. Patches for a newly found bug go in fuzz/Cargo.toml only;
# patching root would silently "fix" the examples and defeat their purpose.
