[workspace]
members = [".", "llm_benchmark"]
exclude = ["fuzz"]
resolver = "2"

[package]
name = "fuzzburn"
version = "0.1.0"
edition = "2024"

[features]
default = []
oracle-tch = ["burn/tch", "dep:tch", "dep:torch-sys"]

[dependencies]
burn = { version = "0.20.1", features = ["autodiff", "ndarray"] }
arbitrary = { version = "1.3", features = ["derive"] }
tch = { version = "0.22.0", optional = true }
torch-sys = { version = "0.22.0", optional = true }
burn-ir = "0.20.1"
